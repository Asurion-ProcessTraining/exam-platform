<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { font-family: 'Inter', system-ui, sans-serif; }

    /* ── Option cards ── */
    .opt-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.75rem;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
    }
    .opt-card:hover { border-color: #3B7DD8; background: #eff6ff; }
    .opt-card.selected { border-color: #0E1F3D; background: #0E1F3D; }
    .opt-card.selected .opt-letter { background: rgba(255,255,255,0.15); border-color: transparent; color: #fff; }
    .opt-card.selected .opt-text { color: #fff; }

    /* Review states */
    .opt-card.review-correct { border-color: #16a34a; background: #f0fdf4; }
    .opt-card.review-correct .opt-letter { background: #16a34a; color: #fff; border-color: transparent; }
    .opt-card.review-correct .opt-text { color: #15803d; }
    .opt-card.review-wrong { border-color: #dc2626; background: #fff1f2; }
    .opt-card.review-wrong .opt-letter { background: #dc2626; color: #fff; border-color: transparent; }
    .opt-card.review-wrong .opt-text { color: #b91c1c; }
    .opt-card.review-missed { border-color: #16a34a; background: #f0fdf4; opacity: 0.7; }
    .opt-card.review-missed .opt-letter { border-color: #16a34a; color: #16a34a; }
    .opt-card.review-missed .opt-text { color: #15803d; }

    .opt-letter {
      flex-shrink: 0;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #64748b;
    }
    .opt-text { font-size: 0.875rem; line-height: 1.4; color: #1e293b; }

    /* ── Progress bar ── */
    .progress-fill { transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }

    /* ── Score ring ── */
    #score-arc {
      stroke-dasharray: 364.4;
      stroke-dashoffset: 364.4;
      transition: stroke-dashoffset 1.3s cubic-bezier(0.23, 1, 0.32, 1),
                  stroke 0.3s ease;
    }

    /* ── Question card entrance ── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .q-enter { animation: slideIn 0.22s ease forwards; }

    /* ── Timer warning ── */
    .timer-warn { color: #dc2626; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }

    /* ── Nav dot indicators ── */
    .q-dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 50%;
      background: #cbd5e1;
      transition: background 0.15s;
      cursor: pointer;
    }
    .q-dot.answered  { background: #3B7DD8; }
    .q-dot.current   { background: #0E1F3D; transform: scale(1.35); }

    /* ── Results fade ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease both; }
    .fade-up-2 { animation: fadeUp 0.4s 0.15s ease both; }
    .fade-up-3 { animation: fadeUp 0.4s 0.3s ease both; }
  </style>
</head>

<body class="bg-[#0E1F3D] min-h-screen">

<!-- ════════════════════════════════════════════════════
     CONFIGURATION — set your Google Apps Script URL here
     ════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyMtCRsGpamp3C2qhl-l6pj6oVwzPNjvp7AfSna5PADJeCsRMPg2KJyWqX1wOc6uFCBmA/exec',

  MAX_QUESTIONS:      10,
  PASS_THRESHOLD:     0.90,     // 90%
  EXAM_MINUTES:       20,
};
</script>

<!-- ════════════════════════════════════════════════════
     SHARED HEADER (always visible)
     ════════════════════════════════════════════════════ -->
<header class="border-b border-white/10 px-5 py-3.5">
  <div class="max-w-2xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <svg class="w-6 h-6 text-[#3B7DD8]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806
             3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806
             3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946
             3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946
             3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806
             3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806
             3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946
             3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946
             3.42 3.42 0 013.138-3.138z"/>
      </svg>
      <span class="text-white font-semibold text-sm tracking-tight">QualityAssure</span>
    </div>
    <span class="text-white/35 text-xs">Assessment Portal</span>
  </div>
</header>


<!-- ════════════════════════════════════════════════════
     SCREEN 1 · LANDING
     ════════════════════════════════════════════════════ -->
<div id="screen-landing" data-screen style="display:none" class="min-h-[calc(100vh-53px)] flex flex-col items-center justify-center px-4 py-12">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-white text-2xl font-bold mb-2 tracking-tight">Skills Assessment</h1>
      <p class="text-white/45 text-sm">Enter your details and choose an exam to begin.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl shadow-black/40 p-8">
      <div id="landing-error" style="display:none"
        class="mb-5 flex items-start gap-2.5 p-3.5 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
        <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="landing-error-text"></span>
      </div>

      <div class="space-y-5">
        <div>
          <label for="input-name" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide" style="letter-spacing:0.05em">Full Name</label>
          <input id="input-name" type="text" autocomplete="name" placeholder="e.g. Maria Santos"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-800
                   placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3B7DD8]/30
                   focus:border-[#3B7DD8] transition" />
        </div>

        <div>
          <label for="input-email" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide" style="letter-spacing:0.05em">Email Address</label>
          <input id="input-email" type="email" autocomplete="email" placeholder="you@company.com"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-800
                   placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3B7DD8]/30
                   focus:border-[#3B7DD8] transition" />
        </div>

        <div>
          <label for="select-exam" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide" style="letter-spacing:0.05em">Exam Topic / Set</label>
          <div class="relative">
            <select id="select-exam"
              class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-800
                     bg-white appearance-none focus:outline-none focus:ring-2 focus:ring-[#3B7DD8]/30
                     focus:border-[#3B7DD8] transition pr-9">
              <option value="">Loading exams…</option>
            </select>
            <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
          <p id="exam-hint" style="display:none" class="mt-1.5 text-xs text-slate-500"></p>
        </div>

        <button id="btn-start" onclick="startExam()"
          class="w-full py-3 bg-[#0E1F3D] text-white text-sm font-semibold rounded-lg
                 hover:bg-[#162d4c] active:bg-[#0a1628] transition
                 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#3B7DD8]
                 disabled:opacity-50 disabled:cursor-not-allowed">
          Begin Exam
        </button>
      </div>

      <p class="mt-5 text-center text-xs text-slate-400">
        10 questions &nbsp;·&nbsp; 90% to pass &nbsp;·&nbsp; 20-minute limit
      </p>
    </div>
  </div>
</div>


<!-- ════════════════════════════════════════════════════
     SCREEN 2 · EXAM
     ════════════════════════════════════════════════════ -->
<div id="screen-exam" data-screen style="display:none" class="min-h-[calc(100vh-53px)] flex flex-col bg-slate-50">

  <div class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-20 shadow-sm">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-2">
        <span id="exam-bar-label" class="text-xs font-semibold text-slate-700 truncate max-w-[60%]"></span>
        <div class="flex items-center gap-3">
          <span id="q-counter" class="text-xs text-slate-500"></span>
          <div id="timer-display"
            class="font-mono text-sm font-semibold text-slate-700 bg-slate-100 px-3 py-1 rounded-full tabular-nums">
            20:00
          </div>
        </div>
      </div>
      <div class="h-1 bg-slate-100 rounded-full overflow-hidden">
        <div id="progress-bar" class="progress-fill h-full bg-[#3B7DD8] rounded-full" style="width:0%"></div>
      </div>
      <div id="q-dots" class="flex items-center gap-1.5 mt-2 flex-wrap"></div>
    </div>
  </div>

  <main class="flex-1 flex justify-center px-4 py-8">
    <div id="q-card" class="w-full max-w-2xl q-enter">

      <div id="q-image-wrap" style="display:none" class="mb-5 rounded-xl overflow-hidden border border-slate-200 bg-white">
        <img id="q-image" src="" alt="Question diagram"
          class="w-full max-h-72 object-contain p-2" />
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-6 py-5 mb-4">
        <p id="q-number-label" class="text-xs font-semibold text-[#3B7DD8] mb-2.5"></p>
        <p id="q-text" class="text-[#0F172A] text-base font-medium leading-relaxed"></p>
      </div>

      <div id="q-options" class="space-y-2.5"></div>

      <p id="skip-warn" style="display:none"
        class="mt-3 text-center text-xs text-amber-600 font-medium">
        Please select an answer to continue.
      </p>

      <div class="flex items-center justify-between mt-6 gap-3">
        <button id="btn-prev" onclick="prevQ()" style="display:none"
          class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200
                 rounded-lg hover:bg-slate-50 transition focus:outline-none focus:ring-2 focus:ring-[#3B7DD8]/30">
          ← Back
        </button>
        <div class="flex-1"></div>
        <button id="btn-next" onclick="nextQ()"
          class="px-6 py-2.5 text-sm font-semibold text-white bg-[#0E1F3D] rounded-lg
                 hover:bg-[#162d4c] transition focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-[#3B7DD8]">
          Next →
        </button>
        <button id="btn-submit" onclick="confirmSubmit()" style="display:none"
          class="px-6 py-2.5 text-sm font-semibold text-white bg-green-600 rounded-lg
                 hover:bg-green-700 transition focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-green-500">
          Submit Exam
        </button>
      </div>

    </div>
  </main>
</div>


<!-- ════════════════════════════════════════════════════
     SCREEN 3 · RESULTS
     ════════════════════════════════════════════════════ -->
<div id="screen-results" data-screen style="display:none" class="min-h-[calc(100vh-53px)] bg-slate-50 pb-16">
  <div class="max-w-2xl mx-auto px-4 pt-10">

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center mb-5 fade-up">

      <div class="flex justify-center mb-5">
        <div style="display:grid; place-items:center; width:148px; height:148px;">
          <svg style="grid-area:1/1" width="148" height="148" viewBox="0 0 148 148" class="-rotate-90" aria-hidden="true">
            <circle cx="74" cy="74" r="60" fill="none" stroke="#e2e8f0" stroke-width="12"/>
            <circle id="score-arc" cx="74" cy="74" r="60" fill="none" stroke="#16a34a"
              stroke-width="12" stroke-linecap="round"
              stroke-dasharray="376.99" stroke-dashoffset="376.99"/>
          </svg>
          <div style="grid-area:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <span id="score-pct" class="text-[1.9rem] font-bold leading-none text-[#0F172A]">0%</span>
            <span id="score-raw" class="text-xs text-slate-500 mt-1">0 / 10</span>
          </div>
        </div>
      </div>

      <div id="status-badge" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-semibold mb-3"></div>

      <h2 id="results-headline" class="text-xl font-bold text-[#0F172A] mb-1"></h2>
      <p id="results-examname" class="text-sm text-slate-500"></p>

      <div class="mt-6 pt-5 border-t border-slate-100 grid grid-cols-3 gap-2 text-center">
        <div>
          <p id="stat-correct"   class="text-2xl font-bold text-[#0F172A]">–</p>
          <p class="text-xs text-slate-500 mt-0.5">Correct</p>
        </div>
        <div>
          <p id="stat-incorrect" class="text-2xl font-bold text-[#0F172A]">–</p>
          <p class="text-xs text-slate-500 mt-0.5">Incorrect</p>
        </div>
        <div>
          <p id="stat-time"      class="text-2xl font-bold text-[#0F172A]">–</p>
          <p class="text-xs text-slate-500 mt-0.5">Time taken</p>
        </div>
      </div>
    </div>

    <div id="submission-status" style="display:none"
      class="mb-4 p-3 rounded-lg text-sm text-center fade-up-2"></div>

    <div class="fade-up-3">
      <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3" style="letter-spacing:0.07em">Incorrect Items Review</h3>
      <div id="review-list" class="space-y-3"></div>
    </div>

    <div class="text-center mt-10">
      <button onclick="retake()"
        class="px-8 py-3 bg-[#0E1F3D] text-white text-sm font-semibold rounded-lg
               hover:bg-[#162d4c] transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#3B7DD8]">
        Retake Exam
      </button>
    </div>

  </div>
</div>


<!-- ════════════════════════════════════════════════════
     APPLICATION JAVASCRIPT
     ════════════════════════════════════════════════════ -->
<script>
const S = {
  name:         '',
  email:        '',
  examSet:      '',
  questions:    [],
  idx:          0,
  answers:      {},
  startedAt:    0,
  timerSecs:    CONFIG.EXAM_MINUTES * 60,
  timerHandle:  null,
  allExams:     [],
  resultsData:  [],
};

function showScreen(id) {
  document.querySelectorAll('[data-screen]').forEach(el => (el.style.display = 'none'));
  document.getElementById(id).style.display = '';
  window.scrollTo(0, 0);
}

(async function init() {
  showScreen('screen-landing');
  
  document.getElementById('input-name').addEventListener('input', updateExamDropdown);
  document.getElementById('input-email').addEventListener('input', updateExamDropdown);

  await fetchInitialData();
})();

async function fetchInitialData() {
  const sel = document.getElementById('select-exam');
  sel.innerHTML = '<option value="">Loading exams…</option>';
  try {
    const rExams = await fetch(`${CONFIG.API_URL}?action=list`);
    const dExams = await rExams.json();
    S.allExams = (dExams.examNames || []).sort();

    try {
      const rResults = await fetch(`${CONFIG.API_URL}?action=results`);
      if (rResults.ok) {
        const dResults = await rResults.json();
        S.resultsData = dResults.results || [];
      }
    } catch (e) {
      console.warn('Results fetch failed:', e);
    }

    updateExamDropdown();
  } catch (e) {
    sel.innerHTML = '<option value="">⚠ Could not load exams</option>';
  }
}

function updateExamDropdown() {
  const sel = document.getElementById('select-exam');
  const inputName = document.getElementById('input-name').value.trim().toLowerCase();
  const inputEmail = document.getElementById('input-email').value.trim().toLowerCase();

  if (!S.allExams.length) {
    sel.innerHTML = '<option value="">No exams found</option>';
    return;
  }

  const takenSets = new Set();
  S.resultsData.forEach(row => {
    const rowName = (row.Name || '').toString().trim().toLowerCase();
    const rowEmail = (row.Email || '').toString().trim().toLowerCase();
    const rowExamSet = (row.ExamSet || '').toString().trim();

    if ((inputName && rowName === inputName) || (inputEmail && rowEmail === inputEmail)) {
      if (rowExamSet) takenSets.add(rowExamSet);
    }
  });

  const availableExams = S.allExams.filter(exam => !takenSets.has(exam));

  sel.innerHTML = '';
  if (!availableExams.length) {
    sel.innerHTML = '<option value="">All exams have been completed</option>';
    document.getElementById('exam-hint').style.display = 'none';
    return;
  }

  const defaultOpt = document.createElement('option');
  defaultOpt.value = '';
  defaultOpt.textContent = '— Choose an exam set —';
  sel.appendChild(defaultOpt);

  availableExams.forEach(n => {
    const o = document.createElement('option');
    o.value = o.textContent = n;
    sel.appendChild(o);
  });

  sel.onchange = () => {
    const v = sel.value;
    const h = document.getElementById('exam-hint');
    if (v) {
      h.textContent = `${v}  ·  up to ${CONFIG.MAX_QUESTIONS} questions  ·  pass at ${Math.round(CONFIG.PASS_THRESHOLD * 100)}%`;
      h.style.display = '';
    } else {
      h.style.display = 'none';
    }
  };
}

async function startExam() {
  const name  = document.getElementById('input-name').value.trim();
  const email = document.getElementById('input-email').value.trim();
  const exam  = document.getElementById('select-exam').value;
  const errEl = document.getElementById('landing-error');
  const errTx = document.getElementById('landing-error-text');

  errEl.style.display = 'none';
  const bail = (msg) => { errTx.textContent = msg; errEl.style.display = ''; };

  if (!name) return bail('Enter your full name.');
  if (!email || !isValidEmail(email)) return bail('Enter a valid email address.');
  if (!exam) return bail('Select an exam topic.');

  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Verifying registration…';

  try {
    const vr = await fetch(`${CONFIG.API_URL}?action=verify&email=${encodeURIComponent(email)}`);
    const vd = await vr.json();
    if (!vd.allowed) return bail(vd.reason || 'You are not registered for this assessment.');

    btn.textContent = 'Loading questions…';
    const r = await fetch(`${CONFIG.API_URL}?action=questions&exam=${encodeURIComponent(exam)}`);
    const d = await r.json();

    if (!d.questions || !d.questions.length) throw new Error('No questions found for this exam.');

    S.name       = name;
    S.email      = email;
    S.examSet    = exam;
    S.questions  = shuffle(d.questions).slice(0, CONFIG.MAX_QUESTIONS);
    S.idx        = 0;
    S.answers    = {};
    S.startedAt  = Date.now();
    S.timerSecs  = CONFIG.EXAM_MINUTES * 60;

    showScreen('screen-exam');
    document.getElementById('exam-bar-label').textContent = exam;
    buildDots();
    renderQ();
    startTimer();
  } catch (e) {
    bail(e.message || 'Could not load questions.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Begin Exam';
  }
}

function startTimer() {
  clearInterval(S.timerHandle);
  renderTimer();
  S.timerHandle = setInterval(() => {
    S.timerSecs--;
    renderTimer();
    if (S.timerSecs <= 0) {
      clearInterval(S.timerHandle);
      alert('Time is up! Submitting answers now.');
      submitExam();
    }
  }, 1000);
}

function renderTimer() {
  const m = String(Math.floor(S.timerSecs / 60)).padStart(2, '0');
  const s = String(S.timerSecs % 60).padStart(2, '0');
  const el = document.getElementById('timer-display');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('timer-warn', S.timerSecs <= 60);
}

function buildDots() {
  const wrap = document.getElementById('q-dots');
  wrap.innerHTML = '';
  S.questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-dot';
    d.title = `Question ${i + 1}`;
    d.onclick = () => jumpTo(i);
    d.id = `dot-${i}`;
    wrap.appendChild(d);
  });
}

function updateDots() {
  S.questions.forEach((_, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (!d) return;
    d.className = 'q-dot' + (i === S.idx ? ' current' : S.answers[i] !== undefined ? ' answered' : '');
  });
}

function jumpTo(i) {
  S.idx = i;
  renderQ();
}

function renderQ() {
  const q = S.questions[S.idx];
  const total = S.questions.length;
  const card = document.getElementById('q-card');
  card.classList.remove('q-enter');
  void card.offsetWidth;
  card.classList.add('q-enter');

  document.getElementById('q-counter').textContent = `Question ${S.idx + 1} of ${total}`;
  document.getElementById('q-number-label').textContent = `Question ${S.idx + 1} of ${total}`;
  document.getElementById('q-text').textContent = q.QuestionText || q.question || '';
  document.getElementById('progress-bar').style.width = `${((S.idx + 1) / total) * 100}%`;
  updateDots();

  const imgUrl = (q.ImageURL || q.imageUrl || '').trim();
  const imgW = document.getElementById('q-image-wrap');
  if (imgUrl) {
    document.getElementById('q-image').src = imgUrl;
    imgW.style.display = '';
  } else {
    imgW.style.display = 'none';
  }

  const opts = getOptions(q);
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  opts.forEach((text, i) => {
    const L = letters[i];
    const sel = S.answers[S.idx] === L;
    const div = document.createElement('div');
    div.className = 'opt-card' + (sel ? ' selected' : '');
    div.dataset.letter = L;
    div.innerHTML = `<div class="opt-letter">${L}</div><div class="opt-text">${esc(text)}</div>`;
    div.addEventListener('click', () => pickAnswer(L));
    container.appendChild(div);
  });

  const isLast = S.idx === total - 1;
  document.getElementById('btn-prev').style.display = S.idx === 0 ? 'none' : '';
  document.getElementById('btn-next').style.display = isLast ? 'none' : '';
  document.getElementById('btn-submit').style.display = isLast ? '' : 'none';
  document.getElementById('skip-warn').style.display = 'none';
}

function getOptions(q) {
  if (q.OptionA !== undefined) {
    return ['OptionA','OptionB','OptionC','OptionD']
      .map(k => q[k])
      .filter(v => v !== '' && v !== null && v !== undefined);
  }
  if (Array.isArray(q.options)) return q.options;
  return [];
}

function pickAnswer(letter) {
  S.answers[S.idx] = letter;
  document.querySelectorAll('.opt-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.letter === letter);
  });
  document.getElementById('skip-warn').style.display = 'none';
  updateDots();
}

function nextQ() {
  if (S.answers[S.idx] === undefined) {
    document.getElementById('skip-warn').style.display = '';
    return;
  }
  if (S.idx < S.questions.length - 1) { S.idx++; renderQ(); }
}

function prevQ() {
  if (S.idx > 0) { S.idx--; renderQ(); }
}

function confirmSubmit() {
  if (S.answers[S.idx] === undefined) {
    document.getElementById('skip-warn').style.display = '';
    return;
  }
  const unanswered = S.questions.length - Object.keys(S.answers).length;
  const msg = unanswered > 0 ? `You have ${unanswered} unanswered question(s). Submit anyway?` : 'Submit your exam now?';
  if (confirm(msg)) submitExam();
}

function submitExam() {
  clearInterval(S.timerHandle);
  const elapsed = Math.round((Date.now() - S.startedAt) / 1000);
  const total = S.questions.length;
  let correct = 0;

  const reviewItems = S.questions.map((q, i) => {
    const chosen = S.answers[i] || null;
    const answer = (q.CorrectAnswer || q.correctAnswer || q.answer || '').trim().toUpperCase();
    const isRight = chosen !== null && chosen.toUpperCase() === answer;
    if (isRight) correct++;
    return { qIndex: i + 1, text: q.QuestionText || q.question || `Question ${i + 1}`, opts: getOptions(q), chosen, answer, isRight };
  });

  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const passed = (correct / total) >= CONFIG.PASS_THRESHOLD;
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');

  fireResults({
    name: S.name,
    email: S.email,
    examSet: S.examSet,
    score: correct,
    total,
    percentage: pct,
    status: passed ? 'PASS' : 'FAIL',
    timestamp: new Date().toISOString(),
  });

  showScreen('screen-results');
  renderResults({ correct, total, pct, passed, reviewItems, time: `${mm}:${ss}` });
}

function renderResults({ correct, total, pct, passed, reviewItems, time }) {
  const circ = 2 * Math.PI * 60;
  const arc = document.getElementById('score-arc');
  arc.style.stroke = passed ? '#16a34a' : '#dc2626';
  setTimeout(() => { arc.style.strokeDashoffset = circ - (pct / 100) * circ; }, 80);

  document.getElementById('score-pct').textContent = `${pct}%`;
  document.getElementById('score-raw').textContent = `${correct} / ${total}`;

  const badge = document.getElementById('status-badge');
  if (passed) {
    badge.className = 'inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-semibold mb-3 bg-green-50 text-green-700 border border-green-200';
    badge.innerHTML = 'PASSED';
  } else {
    badge.className = 'inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-semibold mb-3 bg-red-50 text-red-700 border border-red-200';
    badge.innerHTML = 'FAILED';
  }

  document.getElementById('results-headline').textContent = passed ? `${S.name}, you passed!` : `${S.name}, keep studying.`;
  document.getElementById('results-examname').textContent = S.examSet;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-incorrect').textContent = total - correct;
  document.getElementById('stat-time').textContent = time;

  const list = document.getElementById('review-list');
  const LETTERS = ['A','B','C','D','E'];
  list.innerHTML = '';

  const incorrectItems = reviewItems.filter(item => !item.isRight);
  if (incorrectItems.length === 0) {
    list.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-600 text-sm font-medium">🎉 Perfect score! No incorrect questions to review.</div>`;
    return;
  }

  incorrectItems.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm px-5 py-4';
    const qLabel = `<p class="text-xs font-semibold mb-2 text-red-500">✗ Question ${item.qIndex}</p>`;
    const qText = `<p class="text-sm font-medium text-[#0F172A] mb-3 leading-snug">${esc(item.text)}</p>`;

    const optsHtml = item.opts.map((o, oi) => {
      const L = LETTERS[oi];
      const chosen = item.chosen === L;
      const correct = item.answer === L;
      let cls = 'opt-card mb-1.5 pointer-events-none ';
      if (correct && chosen) cls += 'review-correct';
      else if (!correct && chosen) cls += 'review-wrong';
      else if (correct && !chosen) cls += 'review-missed';
      const icon = correct ? (chosen ? '✓' : '→') : (chosen ? '✗' : '');
      return `<div class="${cls}"><div class="opt-letter">${icon || L}</div><div class="opt-text text-xs leading-snug">${esc(o)}</div></div>`;
    }).join('');

    const noAns = item.chosen === null ? '<p class="text-xs text-amber-600 mt-2 font-medium">Not answered</p>' : '';
    card.innerHTML = qLabel + qText + optsHtml + noAns;
    list.appendChild(card);
  });
}

async function fireResults(payload) {
  const el = document.getElementById('submission-status');
  el.className = 'mb-4 p-3 rounded-lg text-sm text-center bg-blue-50 text-blue-700 border border-blue-200 fade-up-2';
  el.textContent = 'Saving your results…';
  el.style.display = '';

  try {
    const params = new URLSearchParams({ action: 'submit', ...payload });
    const r = await fetch(`${CONFIG.API_URL}?${params}`);
    const d = await r.json();
    if (d.success) {
      el.className = 'mb-4 p-3 rounded-lg text-sm text-center bg-green-50 text-green-700 border border-green-200 fade-up-2';
      el.textContent = '✓ Results saved.';
    } else throw new Error(d.error || 'Save failed');
  } catch (err) {
    el.className = 'mb-4 p-3 rounded-lg text-sm text-center bg-amber-50 text-amber-700 border border-amber-200 fade-up-2';
    el.textContent = 'Could not save results.';
  }
}

async function retake() {
  showScreen('screen-landing');
  document.getElementById('landing-error').style.display = 'none';
  await fetchInitialData();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isValidEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
